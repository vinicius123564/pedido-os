<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Painel de Peças · O.S.</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
<style>
  :root {
    --bg: #EEEFEC;
    --panel: #E3E4E1;
    --panel-border: #D5D6D2;
    --ink: #1E2124;
    --muted: #6B6F73;
    --muted2: #9A9D99;
    --accent: #E8862C;
    --dark: #1E2124;
    --waiting-accent: #B8862C;
    --waiting-bg: #FBF3E3;
    --waiting-dot: #D99B2B;
    --arrived-accent: #2C6CB8;
    --arrived-bg: #E8F1FB;
    --arrived-dot: #3D8BE8;
    --delivered-accent: #2C8C4E;
    --delivered-bg: #E7F5EC;
    --delivered-dot: #3DAA5C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: var(--ink);
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px; margin-bottom: 20px;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .logo-box {
    background: var(--dark); border-radius: 8px; padding: 10px;
    display: flex; align-items: center; justify-content: center;
  }
  .logo-box svg { width: 20px; height: 20px; }
  h1 { font-size: 19px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.02em; margin: 0; }
  .subtitle { color: var(--muted); font-size: 12px; margin: 2px 0 0; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .sync-note { color: var(--muted2); font-size: 12px; font-style: italic; min-width: 90px; text-align: right; }
  button { font-family: inherit; cursor: pointer; border: none; }
  .btn-primary {
    background: var(--accent); color: #fff; font-size: 14px; font-weight: 600;
    padding: 9px 16px; border-radius: 6px; display: flex; align-items: center; gap: 6px;
  }
  .btn-primary:hover { filter: brightness(0.95); }
  .btn-primary.closing { background: #3A3D40; }
  .btn-logout {
    background: none; color: var(--muted); font-size: 12px; text-decoration: underline;
  }

  .error-banner {
    background: #FBEAEA; color: #A33; border: 1px solid #EFC5C5;
    font-size: 13px; border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
  }

  form.add-form {
    background: #fff; border: 1px solid #DDD; border-radius: 8px; padding: 16px;
    margin-bottom: 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    animation: fadeIn 0.25s ease-out;
  }
  @media (max-width: 720px) { form.add-form { grid-template-columns: 1fr; } }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; }
  .field label .req { color: var(--accent); }
  .field input {
    border: 1px solid #D8D8D5; border-radius: 6px; padding: 7px 10px; font-size: 14px; color: var(--ink); outline: none;
  }
  .field input:focus { border-color: var(--accent); }
  .form-actions { grid-column: 1 / -1; display: flex; justify-content: flex-end; }
  .btn-dark { background: var(--dark); color: #fff; font-size: 14px; font-weight: 600; padding: 9px 18px; border-radius: 6px; }
  .btn-dark:hover { filter: brightness(1.25); }

  .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  @media (max-width: 900px) { .board { grid-template-columns: 1fr; } }
  .column {
    border-radius: 10px; padding: 12px; background: var(--panel); border: 1px solid var(--panel-border);
    background-image: radial-gradient(circle, rgba(0,0,0,0.06) 1px, transparent 1px);
    background-size: 14px 14px;
  }
  .col-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding: 0 4px; }
  .col-title { display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 999px; display: inline-block; }
  .col-title span.label { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; }
  .count-badge { font-size: 12px; font-weight: 700; border-radius: 999px; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
  .empty-col { color: var(--muted2); font-size: 12px; font-style: italic; text-align: center; padding: 24px 0; }

  .card {
    background: #fff; border-radius: 6px; padding: 12px; margin-bottom: 10px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06); animation: fadeIn 0.25s ease-out;
  }
  .card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .os-num { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 800; }
  .del-btn { color: #B8B9B5; background: none; padding: 2px; }
  .del-btn:hover { color: #e04444; }
  .cliente { font-size: 14px; font-weight: 600; color: #3A3D40; margin-bottom: 4px; }
  .meta-line { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .card-actions { display: flex; gap: 8px; margin-top: 10px; }
  .card-actions button {
    flex: 1; font-size: 12px; font-weight: 700; padding: 7px 0; border-radius: 5px;
    display: flex; align-items: center; justify-content: center; gap: 4px;
  }
  .confirm-box {
    margin-top: 10px; background: #F7F7F5; border: 1px solid #E3E3E0; border-radius: 6px; padding: 8px; font-size: 12px;
  }
  .confirm-actions { display: flex; gap: 8px; margin-top: 8px; }
  .confirm-actions button { flex: 1; padding: 6px 0; border-radius: 5px; font-weight: 700; font-size: 12px; }
  .footer-note { color: var(--muted2); font-size: 12px; text-align: center; margin-top: 20px; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  /* Login overlay */
  #loginOverlay {
    position: fixed; inset: 0; background: var(--bg); display: flex;
    align-items: center; justify-content: center; z-index: 50;
  }
  .login-box {
    background: #fff; border-radius: 10px; padding: 28px; width: 320px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08); text-align: center;
  }
  .login-box h2 { font-size: 16px; margin: 0 0 16px; text-transform: uppercase; letter-spacing: 0.02em; }
  .login-box input {
    width: 100%; border: 1px solid #D8D8D5; border-radius: 6px; padding: 9px 10px;
    font-size: 14px; margin-bottom: 10px; outline: none;
  }
  .login-box input:focus { border-color: var(--accent); }
  .login-box button {
    width: 100%; background: var(--dark); color: #fff; font-weight: 700;
    padding: 10px 0; border-radius: 6px; font-size: 14px;
  }
  .login-error { color: #A33; font-size: 12px; margin-top: 8px; min-height: 14px; }
  #appRoot { display: none; }
</style>
</head>
<body>

<div id="loginOverlay">
  <div class="login-box">
    <h2>Painel de Peças</h2>
    <input type="email" id="loginEmail" placeholder="E-mail" autocomplete="username" />
    <input type="password" id="loginSenha" placeholder="Senha" autocomplete="current-password" />
    <button id="loginBtn">Entrar</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div id="appRoot">
<div class="wrap">
  <div class="header">
    <div class="header-left">
      <div class="logo-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="#E8862C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      </div>
      <div>
        <h1>Painel de Peças · O.S.</h1>
        <p class="subtitle">Estoque · Consultores · Peças — atualizado para todos em tempo real</p>
      </div>
    </div>
    <div class="header-right">
      <span class="sync-note" id="syncNote"></span>
      <button class="btn-primary" id="toggleFormBtn">+ Nova O.S.</button>
      <button class="btn-logout" id="logoutBtn">Sair</button>
    </div>
  </div>

  <div id="errorBanner" class="error-banner" style="display:none;"></div>

  <form class="add-form" id="addForm" style="display:none;">
    <div class="field">
      <label>Nº da O.S. <span class="req">*</span></label>
      <input type="text" id="f_os" placeholder="Ex: 4821" required />
    </div>
    <div class="field">
      <label>Consultor responsável</label>
      <input type="text" id="f_consultor" placeholder="Nome do consultor" />
    </div>
    <div class="field">
      <label>Cliente <span class="req">*</span></label>
      <input type="text" id="f_cliente" placeholder="Nome do cliente" required />
    </div>
    <div class="field">
      <label>Modelo da moto</label>
      <input type="text" id="f_modelo" placeholder="Ex: GS 310" />
    </div>
    <div class="field">
      <label>PN da peça</label>
      <input type="text" id="f_pn" placeholder="Ex: 11 42 8 597 448" />
    </div>
    <div class="field">
      <label>Data do pedido</label>
      <input type="date" id="f_data" />
    </div>
    <div class="form-actions">
      <button type="submit" class="btn-dark">Adicionar ao painel</button>
    </div>
  </form>

  <div class="board" id="board"></div>

  <p class="footer-note">Este painel é compartilhado — qualquer computador que abrir este link vê e edita as mesmas O.S., atualizando na hora.</p>
</div>
</div>

<!-- ======================= FIREBASE ======================= -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAfOFIqKEXIEeXzfJXlhtybIY3XsiT7Eys",
    authDomain: "pedidos-5bf5a.firebaseapp.com",
    databaseURL: "https://pedidos-5bf5a-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "pedidos-5bf5a",
    storageBucket: "pedidos-5bf5a.firebasestorage.app",
    messagingSenderId: "419923808108",
    appId: "1:419923808108:web:f742be7945678dd9d0ad49"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const auth = firebase.auth();
  const ordersRef = db.ref("ordens_servico");
</script>
<!-- =========================================================== -->

<script>
  const STATUS = [
    { id: 'aguardando', label: 'Aguardando chegar', accent: 'var(--waiting-accent)', bg: 'var(--waiting-bg)', dot: 'var(--waiting-dot)' },
    { id: 'chegou', label: 'Chegou', accent: 'var(--arrived-accent)', bg: 'var(--arrived-bg)', dot: 'var(--arrived-dot)' },
    { id: 'entregue', label: 'Entregue', accent: 'var(--delivered-accent)', bg: 'var(--delivered-bg)', dot: 'var(--delivered-dot)' },
  ];

  let entries = {};
  let pendingConfirm = null;
  let currentRole = null; // 'admin' | 'consultor'

  function nextStatusId(id) {
    const idx = STATUS.findIndex(s => s.id === id);
    return (idx >= 0 && idx < STATUS.length - 1) ? STATUS[idx + 1].id : null;
  }
  function todayISO() { return new Date().toISOString().slice(0, 10); }
  function fmtDate(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-');
    return `${d}/${m}/${y}`;
  }
  function esc(str) {
    return String(str || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  document.getElementById('f_data').value = todayISO();

  // ---------- LOGIN ----------
  document.getElementById('loginBtn').addEventListener('click', doLogin);
  document.getElementById('loginSenha').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });

  function doLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const senha = document.getElementById('loginSenha').value;
    const errBox = document.getElementById('loginError');
    errBox.textContent = '';
    auth.signInWithEmailAndPassword(email, senha).catch(() => {
      errBox.textContent = 'E-mail ou senha incorretos.';
    });
  }

  document.getElementById('logoutBtn').addEventListener('click', () => auth.signOut());

  auth.onAuthStateChanged((user) => {
    if (!user) {
      document.getElementById('loginOverlay').style.display = 'flex';
      document.getElementById('appRoot').style.display = 'none';
      currentRole = null;
      detachListener();
      return;
    }
    db.ref('roles/' + user.uid).once('value').then((snap) => {
      currentRole = snap.val() || 'consultor';
      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('appRoot').style.display = 'block';
      applyRoleToUI();
      attachListener();
      render();
    });
  });

  function applyRoleToUI() {
    const toggleBtn = document.getElementById('toggleFormBtn');
    toggleBtn.style.display = (currentRole === 'admin') ? 'flex' : 'none';
  }

  // ---------- FORM ----------
  const toggleBtn = document.getElementById('toggleFormBtn');
  const addForm = document.getElementById('addForm');
  toggleBtn.addEventListener('click', () => {
    const show = addForm.style.display === 'none';
    addForm.style.display = show ? 'grid' : 'none';
    toggleBtn.textContent = show ? '✕ Fechar' : '+ Nova O.S.';
    toggleBtn.classList.toggle('closing', show);
  });

  addForm.addEventListener('submit', (e) => {
    e.preventDefault();
    if (currentRole !== 'admin') return;
    const os = document.getElementById('f_os').value.trim();
    const cliente = document.getElementById('f_cliente').value.trim();
    if (!os || !cliente) return;
    const newEntry = {
      os,
      cliente,
      consultor: document.getElementById('f_consultor').value.trim(),
      modelo: document.getElementById('f_modelo').value.trim(),
      pn: document.getElementById('f_pn').value.trim(),
      dataPedido: document.getElementById('f_data').value || todayISO(),
      status: 'aguardando',
      createdAt: Date.now(),
    };
    ordersRef.push(newEntry)
      .then(() => {
        addForm.reset();
        document.getElementById('f_data').value = todayISO();
        addForm.style.display = 'none';
        toggleBtn.textContent = '+ Nova O.S.';
        toggleBtn.classList.remove('closing');
      })
      .catch(showError);
  });

  function showError(err) {
    const banner = document.getElementById('errorBanner');
    banner.style.display = 'block';
    banner.textContent = 'Ação não permitida ou falha de conexão.';
    console.error(err);
  }

  function advance(key) {
    if (currentRole !== 'admin') return;
    const entry = entries[key];
    if (!entry) return;
    const next = nextStatusId(entry.status);
    if (!next) return;
    ordersRef.child(key).update({ status: next }).catch(showError);
  }

  function requestFinalize(key) { pendingConfirm = key; render(); }
  function confirmFinalize(key) { ordersRef.child(key).remove().catch(showError); pendingConfirm = null; }
  function cancelConfirm() { pendingConfirm = null; render(); }
  function removeDirect(key) {
    if (currentRole !== 'admin') return;
    pendingConfirm = key; render();
  }

  window._painelActions = { advance, requestFinalize, confirmFinalize, cancelConfirm, removeDirect };

  function render() {
    const board = document.getElementById('board');
    board.innerHTML = '';

    STATUS.forEach(col => {
      const items = Object.entries(entries)
        .filter(([, e]) => e.status === col.id)
        .sort((a, b) => (a[1].createdAt || 0) - (b[1].createdAt || 0));

      const colDiv = document.createElement('div');
      colDiv.className = 'column';

      let cardsHtml = '';
      if (items.length === 0) {
        cardsHtml = `<div class="empty-col">Nenhuma O.S. aqui</div>`;
      } else {
        items.forEach(([key, entry]) => {
          const nextId = nextStatusId(entry.status);
          let actionsHtml = '';
          if (nextId && currentRole === 'admin') {
            actionsHtml += `<button style="background:${col.bg};color:${col.accent}" onclick="_painelActions.advance('${key}')">Avançar ›</button>`;
          }
          if (entry.status === 'entregue') {
            actionsHtml += `<button style="background:var(--dark);color:#fff" onclick="_painelActions.requestFinalize('${key}')">Finalizar ✓</button>`;
          }

          let confirmHtml = '';
          if (pendingConfirm === key) {
            const msg = entry.status === 'entregue'
              ? 'Finalizar remove esta O.S. do painel. Confirmar?'
              : 'Remover esta O.S. do painel. Confirmar?';
            confirmHtml = `
              <div class="confirm-box">
                <div>${msg}</div>
                <div class="confirm-actions">
                  <button style="background:var(--dark);color:#fff" onclick="_painelActions.confirmFinalize('${key}')">Confirmar</button>
                  <button style="background:#E7E7E4;color:#3A3D40" onclick="_painelActions.cancelConfirm()">Cancelar</button>
                </div>
              </div>`;
          }

          const delBtn = (currentRole === 'admin')
            ? `<button class="del-btn" title="Remover" onclick="_painelActions.removeDirect('${key}')">🗑</button>`
            : '';

          cardsHtml += `
            <div class="card" style="border-left:4px solid ${col.accent}">
              <div class="card-top">
                <div class="os-num">#${esc(entry.os)}</div>
                ${delBtn}
              </div>
              <div class="cliente">${esc(entry.cliente)}</div>
              ${entry.modelo ? `<div class="meta-line">🏍 ${esc(entry.modelo)}</div>` : ''}
              ${entry.pn ? `<div class="meta-line">📦 PN ${esc(entry.pn)}</div>` : ''}
              ${entry.consultor ? `<div class="meta-line">👤 ${esc(entry.consultor)}</div>` : ''}
              <div class="meta-line">📅 Pedido em ${fmtDate(entry.dataPedido)}</div>
              <div class="card-actions">${actionsHtml}</div>
              ${confirmHtml}
            </div>`;
        });
      }

      colDiv.innerHTML = `
        <div class="col-header">
          <div class="col-title">
            <span class="dot" style="background:${col.dot}"></span>
            <span class="label">${col.label}</span>
          </div>
          <span class="count-badge" style="background:${col.bg};color:${col.accent}">${items.length}</span>
        </div>
        ${cardsHtml}`;

      board.appendChild(colDiv);
    });
  }

  let listenerAttached = false;
  function attachListener() {
    if (listenerAttached) return;
    listenerAttached = true;
    ordersRef.on('value', (snapshot) => {
      entries = snapshot.val() || {};
      document.getElementById('errorBanner').style.display = 'none';
      if (currentRole) render();
      const note = document.getElementById('syncNote');
      note.textContent = 'Sincronizado';
      setTimeout(() => { note.textContent = ''; }, 1600);
    }, showError);
  }
  function detachListener() {
    ordersRef.off();
    listenerAttached = false;
  }
</script>

</body>
</html>
